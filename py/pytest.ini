[pytest]
# subprocess.run() with capture_output=True conflicts with pytest's own fd
# capturing on Windows in some environments (sandboxed shells in particular -
# CreateProcess fails with WinError 50 trying to duplicate pytest's captured
# stdout/stderr handles), so this suite spawns web.py/split_spreads.py as
# real subprocesses. Disabling pytest's capture avoids that clash; it also
# means print()/log output from a failing test is visible directly, which is
# a reasonable trade either way.
addopts = --capture=no
